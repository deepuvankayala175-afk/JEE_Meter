<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JEEmeter — JEE Prep Hub</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">JEE</span><span class="brand-name">meter</span>
    </div>
    <nav class="nav">
      <button class="nav-btn active" data-view="home">Quizzes</button>
      <button class="nav-btn" data-view="progress">Progress</button>
    </nav>
  </header>

  <main id="app" class="container"></main>

  <footer class="footer">
    Progress is saved in this browser (localStorage).
    <button id="reset-btn" class="link-btn">Reset all progress</button>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
